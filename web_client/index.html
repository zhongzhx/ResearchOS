<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AURA Research</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <button class="brand-lockup" type="button" data-view-target="chat" aria-label="Open chat">
          <span class="brand-mark">A</span>
          <span class="brand-copy">
            <strong>AURA Research</strong>
            <small>AI research workspace for wet-lab scientists</small>
          </span>
        </button>
        <div id="projectSwitcher" class="project-switcher"></div>
        <div class="top-status">
          <span id="dualAgentPill" class="status-pill muted">Dual Agent</span>
          <span id="runtimePill" class="status-pill muted">Runtime</span>
          <button class="button ghost small" type="button" data-view-target="settings">Settings</button>
        </div>
      </header>

      <div class="workspace-shell">
        <aside class="sidebar" aria-label="Main navigation">
          <nav class="nav-list">
            <button class="nav-item is-active" type="button" data-view-target="chat">Chat</button>
            <button class="nav-item" type="button" data-view-target="task_lifecycle">Task Lifecycle</button>
            <button class="nav-item" type="button" data-view-target="brain">Research Brain</button>
            <button class="nav-item" type="button" data-view-target="library">Library</button>
            <button class="nav-item" type="button" data-view-target="skills">Skills</button>
            <button class="nav-item" type="button" data-view-target="runs">Runs</button>
            <button class="nav-item" type="button" data-view-target="settings">Settings</button>
          </nav>
          <div class="sidebar-note">
            <span class="status-dot" id="backendDot"></span>
            <span id="backendText">Connecting</span>
          </div>
        </aside>

        <main id="viewRoot" class="view-root" tabindex="-1"></main>
      </div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
